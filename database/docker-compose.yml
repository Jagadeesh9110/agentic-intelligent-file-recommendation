
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: agentic-files-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: agentic_files
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - agentic_files_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_files"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agentic_files_postgres_data:
